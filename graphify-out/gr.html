    vx: 0, vy: 0
  };

// Простая симуляция
function simulateLayout() {
  const nodes = Object.values(nodeMap);
  const iterations = 400;
  const k = 150;

  for (let iter = 0; iter < iterations; iter++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const force = k * k / (dist * dist);
        a.vx += (dx / dist) * force * 0.01;
        a.vy += (dy / dist) * force * 0.01;
        b.vx -= (dx / dist) * force * 0.01;
        b.vy -= (dy / dist) * force * 0.01;
      }
    }

    RAW_EDGES.forEach(edge => {
      const a = nodeMap[edge.from];
      const b = nodeMap[edge.to];
      if (!a || !b) return;
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const force = dist * dist / k * 0.005;
      a.vx -= (dx / dist) * force;
      a.vy -= (dy / dist) * force;
      b.vx += (dx / dist) * force;
      b.vy += (dy / dist) * force;
    });

    nodes.forEach(n => {
      n.vx += (W/2 - n.x) * 0.0003;
      n.vy += (H/2 - n.y) * 0.0003;
    });

    nodes.forEach(n => {
      n.x += n.vx;
      n.y += n.vy;
      n.vx *= 0.92;
      n.vy *= 0.92;
      n.x = Math.max(30, Math.min(W - 30, n.x));
      n.y = Math.max(30, Math.min(H - 30, n.y));
    });
  }
}

simulateLayout();

// ============ ОТРИСОВКА ============
let hoveredNode = null;
let selectedNode = null;
let dragNode = null;
let dragOffsetX = 0, dragOffsetY = 0;
let isDragging = false;

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Рёбра
  RAW_EDGES.forEach(edge => {
    const a = nodeMap[edge.from];
    const b = nodeMap[edge.to];
    if (!a || !b) return;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = '#2a2a4e';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // Узлы
  Object.values(nodeMap).forEach(n => {
    const isHover = hoveredNode === n.id;
    const isSelected = selectedNode === n.id;
    const radius = isHover ? 16 : (isSelected ? 14 : 10);

    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;

    ctx.beginPath();
    ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    ctx.strokeStyle = isHover ? '#ffffff' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = isHover ? 2 : 1;
    ctx.stroke();

    ctx.fillStyle = '#e0e0e0';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(n.label, n.x, n.y - radius - 4);
  });

  requestAnimationFrame(draw);
}

draw();

// ============ ВЗАИМОДЕЙСТВИЕ ============
function getNodeAt(mx, my) {
  let best = null, bestDist = 30;
  Object.values(nodeMap).forEach(n => {
    const dist = Math.hypot(mx - n.x, my - n.y);
    if (dist < bestDist) {
      bestDist = dist;
      best = n;
    }
  });
  return best;
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (isDragging && dragNode) {
    dragNode.x = mx - dragOffsetX;
    dragNode.y = my - dragOffsetY;
    return;
  }

  const node = getNodeAt(mx, my);
  hoveredNode = node ? node.id : null;
  canvas.style.cursor = node ? 'pointer' : 'default';
});

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const node = getNodeAt(mx, my);
  if (node) {
    isDragging = true;
    dragNode = node;
    dragOffsetX = mx - node.x;
    dragOffsetY = my - node.y;
    selectedNode = node.id;
    showInfo(node.id);
  }
});

canvas.addEventListener('mouseup', () => {
  isDragging = false;
  dragNode = null;
});

canvas.addEventListener('mouseleave', () => {
  isDragging = false;
  dragNode = null;
});

// ============ INFO PANEL ============
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showInfo(nodeId) {
  const n = nodeMap[nodeId];
  if (!n) return;
  const neighbors = RAW_EDGES
    .filter(e => e.from === nodeId || e.to === nodeId)
    .map(e => e.from === nodeId ? e.to : e.from)
    .map(id => nodeMap[id])
    .filter(Boolean);

  const neighborItems = neighbors.map(nb =>
    `<span class="neighbor-link" style="border-left-color:${esc(nb.color)}" data-nid="${esc(nb.id)}">${esc(nb.label)}</span>`
  ).join('');

  document.getElementById('info-content').innerHTML = `
    <div class="field"><b>${esc(n.label)}</b></div>
    <div class="field">Type: ${esc(n.file_type || 'unknown')}</div>
    <div class="field">Community: ${esc(n.community_name)}</div>
    <div class="field">Source: ${esc(n.source_file || '-')}</div>
    <div class="field">Degree: ${n.degree}</div>
    ${neighbors.length ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (${neighbors.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}
  `;
}

document.addEventListener('click', e => {

  if (el && el.dataset.nid !== undefined) {
    const id = el.dataset.nid;
    selectedNode = id;
    showInfo(id);
  }
});

// ============ SEARCH ============
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color}`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
      selectedNode = n.id;
      showInfo(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
      const node = nodeMap[n.id];
      if (node) {
        const dx = node.x - W/2;
        const dy = node.y - H/2;
        Object.values(nodeMap).forEach(n2 => {
          n2.x -= dx * 0.3;
          n2.y -= dy * 0.3;
        });
      }
    };
    searchResults.appendChild(el);
  });
});

document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

// ============ LEGEND ============
const hiddenCommunities = new Set();
const selectAllCb = document.getElementById('select-all-cb');
const legendEl = document.getElementById('legend');

function updateSelectAllState() {
  const total = LEGEND.length;
  const hidden = hiddenCommunities.size;
  selectAllCb.checked = hidden === 0;
  selectAllCb.indeterminate = hidden > 0 && hidden < total;
}

function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(item => {
    hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hide;
  });
  LEGEND.forEach(c => {
    if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
  });
  updateSelectAllState();
}

selectAllCb.addEventListener('change', function() {
  toggleAllCommunities(!this.checked);
});

LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'legend-cb';
  cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    updateSelectAllState();
  });
  item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = (e) => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  };
  legendEl.appendChild(item);
});

updateSelectAllState();

console.log('Graph loaded successfully!');
</script>
